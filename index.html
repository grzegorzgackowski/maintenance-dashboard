<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!--Header-->
        <header class="header">
            <div>
                <h1>Maintenance Dashboard</h1>
                <p>Manage maintenance issues in your apartments</p>
            </div>
        </header>


        <!--Dashboard statistics-->
        <section class="stats">

            <div class="stat-card">
                <span class="stat-label">Total Issues</span>
                <strong class="stat-value" id="total-issues">0</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">Pending</span>
                <strong class="stat-value" id="pending-issues">0</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">In Progress</span>
                <strong class="stat-value" id="in-progress-issues">0</strong>
            </div>

            <div class="stat-card">
                <span class="stat-label">Resolved</span>
                <strong class="stat-value" id="resolved-issues">0</strong>
            </div>

        </section>


        <!--Issues section-->
        <main class="issues-section">

            <div class="section-header">
                <div>
                    <h2>Maintenance Issues</h2>
                    <p>Overview of current apartment issues</p>
                </div>

                <button class="add-issue-btn">
                    + Add Issue
                </button>
            </div>


            <!--Issue cards-->
            <div class="issues-list">

 
            </div>

        </main>

    </div>
<script src="js/script.js"></script>
</body>
</html>
